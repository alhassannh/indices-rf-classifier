# Sentinel-2 STAC search
stac:
  url: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  max_cloud_cover: 10
# Area of interest
aoi:
  polygon:
    name: "kano_metro.gpkg"
    crs: "EPSG:4326"
  bbox: null      # [min_lon, min_lat, max_lon, max_lat]
# Raster stacking
stack:
  resolution: 10
  epsg: 32632
# Random Forest training
training:
  samples_per_class: 3000
  random_state: 42
  train_size: 0.7
  n_estimators: 100
# Land-cover class thresholds
thresholds:
  vegetation:
    ndvi: 0.7
    ndvi_re: 0.0
  water:
    ndwi: 0.0
    mndwi: 0.0
  builtup:
    ndvi: 0.2
    bui: 0.05
    ndbi: 0.1
  baresoil:
    ndvi: 0.2
    dbsi: 0.26
    ndti: 0.05
# Trained model
model:
  name: "landcover_rf"
